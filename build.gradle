import work.lclpnet.build.task.GithubDeploymentTask

plugins {
	id 'fabric-loom' version '1.10-SNAPSHOT'
	id 'maven-publish'
	id 'gradle-build-utils' version '1.7.0'
    id 'io.freefair.lombok' version '8.11'
    id 'com.modrinth.minotaur' version '2.4.3'
}

Properties props = buildUtils.loadProperties('publish.properties')  // will be empty, if the file is missing

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        url "https://repo.lclpnet.work/repository/internal"
    }

    // ModMenu
    maven {
        url "https://maven.terraformersmc.com/releases/"
    }

    // cloth-config
    maven {
        url "https://maven.shedaniel.me/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "combat-control" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.getOutput() + client.compileClasspath + client.getOutput()
        runtimeClasspath += main.runtimeClasspath + main.getOutput() + client.runtimeClasspath + client.getOutput()
    }
}

loom {
    runs {
        named('server') {
            source 'testmod'
        }

        named('client') {
            source 'testmod'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(modImplementation("work.lclpnet.mods.kibu:kibu-hook-api:${project.kibu_hook_api_version}"))
    include(modImplementation("work.lclpnet.mods.kibu:kibu-hooks:${project.kibu_hooks_version}"))
    include(modImplementation("work.lclpnet.mods.kibu:kibu-networking-api:${project.kibu_networking_api_version}"))
    include(modImplementation("work.lclpnet.mods.kibu:kibu-config-api:${project.kibu_config_api_version}"))
    include(modImplementation("work.lclpnet.mods.kibu:kibu-scheduler-api:${project.kibu_scheduler_api_version}"))
    include(modImplementation("me.lucko:fabric-permissions-api:${project.permission_api_version}"))

    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modLocalRuntime(modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}"))

    include(implementation('com.electronwill.night-config:core:3.8.1'))
    include(implementation('com.electronwill.night-config:toml:3.8.1'))
    include(implementation('org.json:json:20250107'))
}

[processResources, processTestmodResources].each {
	it.inputs.property "version", project.version

	it.filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release.set(21)
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

[jar, sourcesJar].each {
	it.from("LICENSE.md") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

def env = System.getenv()

tasks.register("github", GithubDeploymentTask) {
    dependsOn tasks.remapJar

    config {
        token = env.get("GITHUB_TOKEN")
        repository = env.get("GITHUB_REPOSITORY")
    }

    release {
        title = "[$project.minecraft_version] $project.name $project.version"
        tag = project.mod_version
    }

    assets.add(tasks.remapJar.archiveFile.get())
}

modrinth {
    token = env.get("MODRINTH_TOKEN")

    projectId = "combat-control"
    versionName = "[$project.minecraft_version] Combat Control $project.version"
    versionType = "release"
    uploadFile = remapJar

    dependencies {
        required.project "fabric-api"
        required.project "cloth-config"
        optional.project "modmenu"
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            pom {
                name = 'combat-control'
                description = 'Player-based combat control mod that aims brings back 1.8 combat to newer versions '
            }
        }
    }

    // automatically use DEPLOY_URL, DEPLOY_USER and DEPLOY_PASSWORD environment variables
    // or mavenHost, mavenUser and mavenPassword from props
    buildUtils.setupPublishRepository(repositories, props)
}